syntax = "proto3";

package company.vk.edu.distrib.compute.dkoften;

option java_multiple_files = true;
option java_package = "company.vk.edu.distrib.compute.dkoften.grpc";
option java_outer_classname = "KvServiceProto";

service KVServiceGrpc {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    int32 status = 1;
    bytes value = 2;
}

message PutRequest {
    string key = 1;
    bytes value = 2;
}

message PutResponse {
    int32 status = 1;
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
    int32 status = 1;
}
